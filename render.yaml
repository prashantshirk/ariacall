services:
  - type: web
    name: aria-voice-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        # Set this to your Vercel frontend URL, e.g. https://your-app.vercel.app
        sync: false
